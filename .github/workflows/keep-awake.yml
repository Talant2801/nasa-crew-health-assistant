# Pings the live demo so the Render free instance does not sleep during judging.
# GitHub may delay scheduled runs; worst case the next visitor waits ~1 min for a cold start.
name: Keep live demo awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping /api/health
        run: curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 https://crew-health-assistant.onrender.com/api/health
